<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFBFB">
<meta name="description" content="小日记 Little Diary：无聊时从签筒里抽一篇旧日记，或者起一支有依据的玄学签。">
<meta name="apple-mobile-web-app-title" content="小日记">
<link rel="icon" type="image/svg+xml" href="icons/xiaoriji-icon-light.svg" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/svg+xml" href="icons/xiaoriji-icon-dark.svg" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="180x180" href="icons/xiaoriji-icon-light-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/xiaoriji-icon-light-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* page reset for standalone hosting */
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
img{max-width:100%}
</style>
<title>小日记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@400;500&family=Long+Cang&family=Lora:ital,wght@0,400;0,500;1,400&family=Literata:ital,opsz,wght@0,7..72,300;1,7..72,300&display=swap">
<style>
/* Layout: one phone-sized screen — header / view / tab bar; overlays (draw, sheets, date picker) sit above.
   Palette tokens are regenerated by JS from the chosen theme hue; these are the 樱粉 defaults.
   Fonts are all SIL OFL 1.1 (Google Fonts). */
:root{
  --bg:#FFFBFB; --bg-out:#F7EFF1; --paper:#FFFFFF; --paper-back:#FCEFF2;
  --blush:#FBE7EC; --blush-2:#F3D3DB; --hair:#EFE3E6;
  --ink:#3B3335; --ink-2:#8E8285; --line:#DCC9CE; --line-strong:#C9B2B8;
  --accent:#DE7489; --accent-ink:#FFFFFF;
  --stick:#F6ECDF; --stick-line:#D9C6B2; --cup:#FFFFFF; --cup-in:#F7E4E9; --wood:#EEDDC6;
  --scrim:rgba(255,246,248,.86);
  --good:#5F9C7B; --bad:#C2546A;
  --m-happy:#F2CF72; --m-calm:#A6CDB6; --m-down:#A9B8D2; --m-angry:#EC9B8A; --m-moved:#EFA6B7; --m-tired:#C4B6DD;
  --f-display:"ZCOOL XiaoWei","Noto Serif SC",serif;
  --f-ui:"Noto Sans SC",-apple-system,"PingFang SC",sans-serif;
  --f-num:"Lora","Noto Serif SC",serif;
  --f-digit:"Literata","Lora","Noto Serif SC",serif;
  --f-classic:"Noto Serif SC",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D191A; --bg-out:#141112; --paper:#282224; --paper-back:#33282C;
  --blush:#3A2B30; --blush-2:#4E3940; --hair:#382E31;
  --ink:#F3EAEC; --ink-2:#A8999D; --line:#5B4A50; --line-strong:#76626A;
  --accent:#F095A7; --accent-ink:#2A1C20;
  --stick:#4A4038; --stick-line:#6A5B4E; --cup:#2A2325; --cup-in:#3A2C31; --wood:#4E4034;
  --scrim:rgba(22,18,19,.86); --good:#8CC4A4; --bad:#F09AAA; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1D191A; --bg-out:#141112; --paper:#282224; --paper-back:#33282C;
  --blush:#3A2B30; --blush-2:#4E3940; --hair:#382E31;
  --ink:#F3EAEC; --ink-2:#A8999D; --line:#5B4A50; --line-strong:#76626A;
  --accent:#F095A7; --accent-ink:#2A1C20;
  --stick:#4A4038; --stick-line:#6A5B4E; --cup:#2A2325; --cup-in:#3A2C31; --wood:#4E4034;
  --scrim:rgba(22,18,19,.86); --good:#8CC4A4; --bad:#F09AAA; color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none}

.app{position:relative;height:100%;max-width:430px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto;background:var(--bg);overflow:hidden;transition:background .3s}
@media (min-width:520px){
  body{background:var(--bg-out);display:grid;place-items:center;padding:16px}
  .app{width:400px;height:min(100%,860px);border:1px solid var(--hair);border-radius:32px;box-shadow:0 30px 80px -40px rgba(80,60,70,.35)}
}

/* doodles */
.doodle{position:absolute;pointer-events:none;color:var(--line);z-index:0}
.doll{top:0;right:20px;width:46px;overflow:visible;transform-origin:50% 0;animation:swing 4.2s ease-in-out infinite alternate}
.doll.still{animation:none}
.sill{left:0;right:0;bottom:62px;width:100%;height:120px}
.app:not(.on-draw) .sill{display:none}
.sill .leaves{animation:sway 5s ease-in-out infinite alternate}
.doll .flutter{animation:flutter 2.6s ease-in-out infinite alternate}
@keyframes flutter{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@keyframes swing{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(3deg)}}

header{position:relative;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px}
.brand{font-family:var(--f-display);font-size:26px;letter-spacing:.06em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-num);font-style:italic;font-size:15px;color:var(--ink-2);letter-spacing:.01em}
.hbtns{display:flex;gap:6px}
.hbtn{height:34px;min-width:34px;padding:0 10px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:4px;color:var(--ink-2);font-size:13px;border:1px solid var(--hair);background:var(--paper)}
.hbtn.ic{padding:0}
.hbtn[aria-pressed="false"] .wave{opacity:0}

main{position:relative;z-index:1;min-height:0}
.view{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}

/* chips */
.row{display:flex;gap:6px;overflow-x:auto;padding:0 2px;scrollbar-width:none;align-items:center}
.row::-webkit-scrollbar{display:none}
.row.wrap{flex-wrap:wrap;overflow:visible}
.row .lab{flex:none;font-size:12px;color:var(--ink-2);letter-spacing:.1em;width:30px}
.chip{flex:none;display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 11px 0 8px;border-radius:999px;border:1px solid var(--hair);background:var(--paper);color:var(--ink-2);font-size:13px;white-space:nowrap;transition:background .2s,color .2s,border-color .2s,transform .15s}
.chip svg{width:16px;height:16px}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{background:var(--blush);border-color:var(--blush-2);color:var(--ink)}
.chip.plain{padding:0 12px}
.chip.add{padding:0;width:30px;justify-content:center;border-style:dashed;color:var(--ink-2)}
.dotc{width:8px;height:8px;border-radius:50%;flex:none}

/* draw: collapsible filter */
.fbar{position:relative;z-index:5;padding:6px 18px 0}
.fbtn{height:34px;display:inline-flex;align-items:center;gap:8px;padding:0 12px;border-radius:999px;border:1px solid var(--hair);background:var(--paper);font-size:13px;color:var(--ink-2);max-width:100%}
.fbtn b{font-weight:400;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fbtn svg{width:14px;height:14px;transition:transform .25s;flex:none}
.fbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.fpanel{position:absolute;left:12px;right:12px;top:46px;background:var(--paper);border:1px solid var(--hair);border-radius:16px;padding:12px 10px;display:grid;gap:10px;box-shadow:0 18px 40px -24px rgba(80,60,70,.4)}
.mlist{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mopt{display:grid;gap:2px;text-align:left;padding:9px 11px;border-radius:12px;border:1px solid var(--hair);background:var(--bg)}
.mopt b{font-weight:500;font-size:14px;font-family:var(--f-classic)}
.mopt span{font-size:11px;color:var(--ink-2);line-height:1.4}
.mopt[aria-pressed="true"]{background:var(--blush);border-color:var(--blush-2)}

/* cup */
.cup-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;position:relative;padding-bottom:110px}
@media (max-height:780px){.cup-area{padding-bottom:150px}.cflow{transform:scale(.86);transform-origin:50% 100%;margin-top:-42px}}
@media (max-height:700px){.cup-area{padding-bottom:166px}.cflow{transform:scale(.78);margin-top:-66px}}
.mbar{position:absolute;left:0;right:0;bottom:134px;display:flex;flex-direction:column;align-items:center;z-index:2}
.cup-area{touch-action:pan-y}
.cflow{position:relative;flex:none;width:160px;height:300px;margin-bottom:24px;perspective:820px;perspective-origin:50% 60%}
.cface{position:absolute;inset:0;transform-origin:50% 70%;will-change:transform,opacity;backface-visibility:hidden;transform-style:flat}
.cface.ghost{pointer-events:none;opacity:0}
.cup-wrap{position:relative;width:160px;height:300px;transform-origin:50% 88%;touch-action:pan-y}
.cup-wrap svg{position:absolute;left:0;top:150px;width:160px;height:150px;overflow:visible}
.cup-back{z-index:0}.sticks{position:absolute;inset:0;z-index:1}.cup-front{z-index:2}
.cup-shadow{position:absolute;left:22px;right:22px;bottom:-8px;height:16px;border-radius:50%;background:radial-gradient(closest-side,var(--blush-2),transparent);z-index:-1}
.stick{position:absolute;bottom:20px;width:11px;margin-left:-5.5px;border-radius:6px 6px 2px 2px;background:var(--stick);border:1.2px solid var(--stick-line);transform-origin:50% 100%}
.stick::before,.fly::before{content:"";position:absolute;left:1.6px;right:1.6px;top:6px;height:24px;border-radius:4px;background:var(--tip,var(--line))}
.stick::after{content:"";position:absolute;left:2px;right:2px;top:38px;height:1px;background:var(--stick-line)}
.cup-hint{position:relative;z-index:1;min-height:19px;margin-top:18px;text-align:center;font-size:13px;color:var(--ink-2);letter-spacing:.06em;padding:0 16px}
.cup-hint b{font-family:var(--f-digit);font-weight:300;font-style:italic;font-size:16px;color:var(--ink)}
.empty-cup{position:absolute;top:58px;left:-60px;right:-60px;z-index:12;text-align:center;font-family:var(--f-display);color:var(--ink-2);font-size:15px;line-height:1.7;pointer-events:none}
.cup-wrap:focus-visible{outline:none}

/* mode switch: 签种名 + 圆点 */
.mswitch{position:relative;z-index:2;display:flex;align-items:center;gap:14px}
.marr{width:30px;height:30px;display:grid;place-items:center;color:var(--line-strong);border-radius:50%}
.marr svg{width:18px;height:18px}
.marr:active{color:var(--ink)}
.mmid{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:84px}
.mname{font-family:var(--f-display);font-size:15px;letter-spacing:.18em;color:var(--ink);padding-left:.18em}
.mdots{display:flex;gap:8px}
.mdots button{width:6px;height:6px;padding:0;border-radius:50%;background:var(--line);transition:width .3s cubic-bezier(.3,1.4,.5,1),background .25s}
.mdots button::after{content:"";position:absolute;inset:-9px}
.mdots button{position:relative}
.mdots button[aria-selected="true"]{width:16px;border-radius:3px;background:var(--accent)}

/* overlay */
.overlay{position:absolute;inset:0;z-index:20}
.scrim{position:absolute;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.stage{position:absolute;inset:0 0 90px;display:grid;place-items:center;perspective:1100px}
.stage>*{grid-area:1/1}
.fly{position:absolute;z-index:3;width:11px;border-radius:6px 6px 2px 2px;background:var(--stick);border:1.2px solid var(--stick-line)}
.note-actions{position:absolute;left:0;right:0;bottom:26px;display:flex;justify-content:center;gap:10px;padding:0 18px}
.btn{height:42px;padding:0 20px;border-radius:999px;font-size:14px;letter-spacing:.06em;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--hair);background:var(--paper);color:var(--ink)}
.btn.sm{height:34px;padding:0 14px;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.45}

/* note card */
.card{position:relative;width:min(86vw,330px);max-height:min(64vh,560px);overflow:auto;background:var(--paper);border-radius:4px;padding:30px 22px 22px;box-shadow:0 1px 0 var(--hair),0 22px 40px -26px rgba(80,60,70,.45);scrollbar-width:none}
.card::-webkit-scrollbar{display:none}
.tape{position:absolute;top:6px;left:50%;width:74px;height:18px;margin-left:-37px;background:var(--blush-2);opacity:.7;transform:rotate(-3deg)}
.n-date{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.n-date .md{font-family:var(--f-digit);font-weight:300;font-style:italic;font-size:40px;line-height:1}
.n-date .yw{font-size:12px;color:var(--ink-2);letter-spacing:.08em}
.n-tags{display:flex;gap:6px;margin:12px 0 14px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px 0 7px;border-radius:999px;background:var(--blush);font-size:12px;color:var(--ink)}
.tag.none{background:transparent;border:1px dashed var(--line);color:var(--ink-2);padding:0 10px}
.tag svg{width:15px;height:15px}
.n-text{font-family:var(--f-display);font-size:17px;line-height:32px;margin:0;white-space:pre-wrap;word-break:break-word;background:repeating-linear-gradient(to bottom,transparent 0 31px,var(--hair) 31px 32px);padding-bottom:2px}
.n-sub{font-size:12px;color:var(--ink-2);letter-spacing:.14em;margin:16px 0 6px}
.n-todo{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.n-todo li{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:baseline;font-size:14px;padding:5px 0;border-bottom:1px dotted var(--hair)}
.n-todo li i{font-style:normal;color:var(--accent);font-size:13px}
.n-todo li .nm{min-width:0;word-break:break-word}
.n-todo li .mt{font-size:11px;color:var(--ink-2);white-space:nowrap}
.n-todo li.undone{color:var(--ink-2)}
.n-todo li.undone i{color:var(--line-strong)}
.n-foot{margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.n-foot .ago{font-family:var(--f-display);font-size:13px}
.badge{font-size:11px;padding:1px 6px;border:1px solid var(--line);border-radius:4px;color:var(--ink-2);white-space:nowrap}

/* oracle card */
.o-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.o-title{font-family:var(--f-classic);font-weight:600;font-size:20px;letter-spacing:.12em}
.o-meta{font-size:11.5px;color:var(--ink-2);line-height:1.6;margin-top:4px}
.o-big{font-family:var(--f-classic);font-weight:600;font-size:34px;letter-spacing:.14em;line-height:1.2;margin:10px 0 2px;display:flex;align-items:center;gap:10px}
.lvl{display:inline-block;padding:1px 8px;border:1.2px solid currentColor;border-radius:4px;font-family:var(--f-classic);font-size:13px;letter-spacing:.16em;font-weight:400}
.lvl.good{color:var(--good)}.lvl.bad{color:var(--bad)}.lvl.mid{color:var(--ink-2)}
.lvl.soft{color:var(--ink-2);border-style:dashed}
.grade{margin:10px 0 2px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper)}
.grade .gtop{display:flex;align-items:center;gap:12px}
.grade .gl{font-family:var(--f-classic);font-size:22px;font-weight:600;letter-spacing:.2em}
.grade.good .gl{color:var(--good)}.grade.mid .gl{color:var(--ink)}.grade.soft .gl{color:var(--ink-2)}.grade.bad .gl{color:var(--bad)}
.gdots{display:flex;gap:5px;margin-left:auto}
.gdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.grade.good .gdots i.on{background:var(--good)}.grade.mid .gdots i.on{background:var(--ink)}.grade.soft .gdots i.on{background:var(--ink-2)}.grade.bad .gdots i.on{background:var(--bad)}
.gdots i.on{transform:scale(1.35)}
.grade .gb{margin-top:6px;font-size:12px;line-height:1.7;color:var(--ink-2)}
.gsrc{display:block;margin-top:3px;font-size:11px;opacity:.85}
.advice{background:var(--blush);border-radius:10px;padding:10px 12px;border:1px solid var(--blush-2)}
.advice h4{color:var(--accent)}
.advice .gloss,.gloss{margin:-2px 0 6px 12px;font-size:12px;line-height:1.7;color:var(--ink-2)}
.tips{margin-top:8px;padding-top:8px;border-top:1px dashed var(--blush-2)}
.ttag{display:inline-block;font-size:10.5px;letter-spacing:.12em;padding:1px 7px;border-radius:999px;border:1px solid var(--accent);color:var(--accent)}
.tips ul{margin:6px 0 0;padding-left:18px}
.tips li{font-size:13px;line-height:1.75;margin:2px 0}
.tips b{font-weight:500}
.qhint.repeat .quote{margin:6px 0}
.und{margin-top:8px;font-size:12.5px;line-height:1.7;color:var(--ink-2);background:var(--paper);border:1px dashed var(--blush-2);border-radius:10px;padding:7px 10px}
.und:empty,.und[hidden]{display:none}
.und b{color:var(--ink);font-weight:500}
.yq{border:1px solid var(--blush-2);border-radius:10px;padding:10px 12px;background:var(--paper)}
.yq h4{color:var(--accent)}
.yq p{font-size:13.5px;line-height:1.8;margin:0 0 6px}
.yq b{font-weight:500}
.dlist{margin:4px 0 6px;padding-left:18px}.dlist li{font-size:13px;line-height:1.8}
.tagx{display:inline-block;margin-left:4px;font-size:10.5px;padding:0 6px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);vertical-align:1px}
.path{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:8px 0 4px}
.path span{padding:2px 8px;border-radius:999px;background:var(--blush);color:var(--ink)}
.path span.on{background:var(--accent);color:var(--accent-ink)}
.verse{font-family:var(--f-classic);font-size:15px;line-height:2;letter-spacing:.06em;margin:10px 0 2px;padding:10px 12px;background:var(--paper-back);border-radius:4px}
.verse mark{background:none;color:var(--accent);border-bottom:1.5px solid var(--accent)}
.qt-line{font-family:var(--f-display);font-size:22px;line-height:1.75;letter-spacing:.04em;margin:16px 0 6px;color:var(--ink)}
.qt-orig{font-family:var(--f-num);font-style:italic;font-size:14.5px;line-height:1.7;letter-spacing:0;word-spacing:0;color:var(--ink-2);margin:2px 0 6px}
.qt-by{text-align:right;font-size:13px;color:var(--ink-2);letter-spacing:.06em;margin-bottom:4px}
.qt-full{font-family:var(--f-classic);font-size:14.5px;line-height:1.95;letter-spacing:.05em;padding:10px 12px;background:var(--paper-back);border-radius:4px}
.qt-full p{margin:0}.qt-full p.gap{height:.7em}
.qt-full mark{background:none;color:var(--accent);border-bottom:1.5px solid var(--accent)}
.qt-full.en{font-family:var(--f-num);font-style:italic;font-size:14px;line-height:1.75;letter-spacing:0;word-spacing:0;margin-top:8px}
.qt-yi{font-size:14px;line-height:1.85;margin:0}
.qbtns{display:inline-flex;gap:8px;align-items:center}
.qb{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--hair);background:var(--paper);color:var(--ink-2);transition:color .2s,background .2s,border-color .2s}
.qb svg{width:17px;height:17px}
.favb[aria-pressed="true"]{color:var(--accent);background:var(--blush);border-color:var(--blush-2)}
.favb[aria-pressed="true"] svg path{fill:var(--accent)}
.mq{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--hair)}
.mq-line{font-family:var(--f-display);font-size:15px;line-height:1.6;color:var(--ink)}
.mq-by{font-size:12px;color:var(--ink-2);margin-top:2px}
.mq .x{flex:none;font-size:12px;color:var(--ink-2);padding:4px 8px;border-radius:999px;border:1px solid var(--hair)}
.mq-empty{font-size:12.5px;color:var(--ink-2);margin:6px 0}
textarea.mq-in{min-height:84px;font-size:15px;line-height:26px;background:var(--bg);border-radius:10px;padding:8px 12px}
.qt-season{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--blush);color:var(--accent);margin-left:6px;letter-spacing:.08em}
.sec{margin-top:14px}
.sec h4{margin:0 0 6px;font-size:11.5px;font-weight:500;color:var(--ink-2);letter-spacing:.16em}
.sec p{margin:0;font-size:13.5px;line-height:1.8}
.quote{font-family:var(--f-classic);font-size:13.5px;line-height:1.85;border-left:2px solid var(--blush-2);padding-left:10px;margin:6px 0}
.quote cite{display:block;font-style:normal;font-family:var(--f-ui);font-size:11px;color:var(--ink-2);margin-top:2px}
.ask{font-size:12.5px;color:var(--ink-2);margin-top:6px}
.ask b{color:var(--ink);font-weight:500}
.guas{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;text-align:center}
.gua{display:grid;justify-items:center;gap:4px;padding:8px 2px;border-radius:8px;background:var(--paper-back);font-size:11px;color:var(--ink-2)}
.gua b{font-family:var(--f-classic);font-weight:600;font-size:13px;color:var(--ink);letter-spacing:.04em}
.gua.main{background:var(--blush)}
.hex{display:grid;gap:3px;width:34px}
.hex i{display:flex;gap:4px;height:4px}
.hex i::before,.hex i::after{content:"";flex:1;background:var(--ink);border-radius:1px}
.hex i.y::before{flex:1}.hex i.y::after{display:none}
.hex i.mv::before,.hex i.mv::after{background:var(--accent)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.pillar{padding:8px 2px;border-radius:8px;background:var(--paper-back)}
.pillar small{display:block;font-size:10.5px;color:var(--ink-2)}
.pillar b{display:block;font-family:var(--f-classic);font-weight:600;font-size:22px;line-height:1.25;letter-spacing:.06em}
.pillar.day b{color:var(--accent)}
.wx{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.wx div{text-align:center;font-size:12px}
.wx i{display:block;height:44px;background:var(--blush);border-radius:4px;position:relative;overflow:hidden;margin-bottom:3px}
.wx i::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--h);background:var(--accent);opacity:.75}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;line-height:1.6}
.kv dt{color:var(--ink-2);font-size:12px}
.kv dd{margin:0}
.ke{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.ke div{padding:6px 2px;border-radius:8px;background:var(--paper-back);font-family:var(--f-classic);font-size:17px;line-height:1.3}
.ke small{display:block;font-family:var(--f-ui);font-size:10px;color:var(--ink-2)}
.chuan{display:grid;gap:4px}
.chuan div{display:grid;grid-template-columns:40px 30px 1fr auto;gap:8px;align-items:baseline;padding:6px 10px;border-radius:8px;background:var(--paper-back);font-size:13px}
.chuan div b{font-family:var(--f-classic);font-size:18px;font-weight:600}
.chuan small{color:var(--ink-2);font-size:11px}
.yj{display:flex;flex-wrap:wrap;gap:5px}
.yj span{font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--blush);cursor:pointer;text-decoration:underline dotted var(--line-strong);text-underline-offset:3px}
.yj.ji span{background:transparent;border:1px solid var(--line);color:var(--ink-2)}

.plain{margin:14px 0 4px;padding:12px 14px;border-radius:8px;background:var(--blush);border:1px solid var(--blush-2)}
.plain h4{margin:0 0 6px;font-size:11.5px;font-weight:500;letter-spacing:.16em;color:var(--accent)}
.plain p{margin:0 0 6px;font-size:14px;line-height:1.85}
.plain p:last-child{margin-bottom:0}
.plain p.sub{font-size:12.5px;color:var(--ink-2)}
.plain b{font-weight:500}
.qhint{margin-top:8px;font-size:12.5px;line-height:1.7;color:var(--ink);background:var(--blush);border-radius:10px;padding:8px 11px}
.qhint b{color:var(--accent);font-weight:500}
.qtip{font-size:11px;color:var(--ink-2);margin-left:6px;letter-spacing:0}
.ntiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ntiles.two{grid-template-columns:repeat(2,1fr)}
.ntile{height:62px;border-radius:14px;border:1px solid var(--hair);background:var(--paper);display:grid;place-content:center;justify-items:center;gap:1px;position:relative;transition:border-color .2s,background .2s}
.ntile b{font-family:var(--f-digit);font-weight:300;font-style:italic;font-size:30px;line-height:1;min-height:30px}
.ntile b.ph{color:var(--line-strong)}
.ntile small{font-size:10.5px;color:var(--ink-2)}
.ntile.on{border-color:var(--accent);background:var(--blush)}
.ntile.on::after{content:"";position:absolute;bottom:8px;width:16px;height:2px;border-radius:1px;background:var(--accent);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.keypad button{height:46px;border-radius:12px;background:var(--paper);border:1px solid var(--hair);font-family:var(--f-digit);font-weight:300;font-size:22px;color:var(--ink);transition:background .12s,transform .12s}
.keypad button.fn{font-family:var(--f-ui);font-weight:400;font-size:13px;color:var(--ink-2)}
.keypad button:active{background:var(--blush);transform:scale(.95)}
.decos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.decos.sills{grid-template-columns:repeat(2,1fr)}
.dopt{border:1px solid var(--hair);border-radius:14px;background:var(--paper);padding:8px 6px;display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--ink-2)}
.dopt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);color:var(--ink)}
.fold,.panel{will-change:transform}
/* fold */
.fold{position:relative;transform-style:preserve-3d}
.panel{position:absolute;left:0;width:100%;transform-style:preserve-3d}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper)}
.face.back{transform:rotateX(180deg);background:var(--paper-back);display:grid;place-items:center}
.face .card{position:absolute;left:0;margin:0;box-shadow:none;overflow:hidden;max-height:none}
.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(80,50,60,.22),rgba(80,50,60,0));pointer-events:none}
.stamp{display:grid;place-items:center;gap:4px;color:var(--ink-2);font-family:var(--f-display);font-size:12px;letter-spacing:.3em}
.stamp .ring{width:40px;height:40px;border-radius:50%;border:1.2px dashed var(--line-strong);display:grid;place-items:center;color:var(--ink);font-size:17px;letter-spacing:0;font-family:var(--f-classic)}
.stamp .ring svg{width:22px;height:22px}

/* tabs */
nav.tabs{position:relative;z-index:3;display:grid;grid-template-columns:repeat(3,1fr);padding:6px 10px 10px;background:linear-gradient(to bottom,transparent,var(--bg) 30%)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 4px;color:var(--ink-2);font-size:12px;letter-spacing:.12em;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;bottom:-1px;width:4px;height:4px;border-radius:50%;background:var(--accent)}

/* write */
.write{padding:6px 18px 24px}
.field-lab{font-size:12px;color:var(--ink-2);letter-spacing:.12em;margin-bottom:8px;display:block}
.datebtn{display:inline-flex;align-items:center;gap:12px;padding:8px 14px 8px 12px;border-radius:14px;border:1px solid var(--hair);background:var(--paper);text-align:left}
.datebtn .big{font-family:var(--f-digit);font-weight:300;font-style:italic;font-size:30px;line-height:1}
.datebtn .sm{display:grid;font-size:12px;color:var(--ink-2);line-height:1.5}
.datebtn .sm b{font-weight:400;color:var(--ink)}
.datebtn svg{width:16px;height:16px;color:var(--ink-2)}
.pk{border-top:1px dashed var(--hair);border-bottom:1px dashed var(--hair)}
.pk+.pk{border-top:0}
.pk-head{width:100%;display:flex;align-items:center;gap:10px;height:46px;font-size:14px;text-align:left}
.pk-head .lab{font-size:12px;color:var(--ink-2);letter-spacing:.12em;width:34px;flex:none}
.pk-sum{flex:1;display:flex;gap:8px;align-items:center;color:var(--ink);min-width:0;overflow:hidden;white-space:nowrap}
.pk-sum .muted{color:var(--ink-2);font-size:13px}
.pk-sum span{display:inline-flex;align-items:center;gap:3px}
.pk-sum svg{width:16px;height:16px}
.pk-head>svg{width:14px;height:14px;color:var(--ink-2);transition:transform .25s;flex:none}
.pk-head[aria-expanded="true"]>svg{transform:rotate(180deg)}
.pk-body{padding:0 0 14px}
textarea{width:100%;min-height:200px;resize:vertical;border:1px solid var(--hair);border-radius:4px;padding:14px 16px;font-family:var(--f-display);font-size:17px;line-height:32px;color:var(--ink);background:repeating-linear-gradient(to bottom,transparent 0 31px,var(--hair) 31px 32px) 0 14px/100% 32px local,var(--paper)}
textarea::placeholder,input::placeholder{color:var(--line-strong)}
.wfoot{display:flex;justify-content:space-between;align-items:center}
.count{font-family:var(--f-digit);font-weight:300;font-style:italic;color:var(--ink-2);font-size:15px}
.shake{animation:nope .35s}
@keyframes nope{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

/* inputs */
.tin{height:38px;border:1px solid var(--hair);border-radius:10px;padding:0 12px;background:var(--bg);color:var(--ink);font-size:14px;width:100%}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nums.two{grid-template-columns:repeat(2,1fr)}
.nums input{text-align:center;font-family:var(--f-digit);font-weight:300;font-size:20px;height:44px}

/* add custom */
.addf{margin-top:10px;border:1px solid var(--hair);border-radius:14px;padding:12px;background:var(--paper);display:grid;gap:10px}
.icopick,.colpick{display:flex;flex-wrap:wrap;gap:6px}
.icopick button{width:34px;height:34px;border-radius:10px;border:1px solid var(--hair);display:grid;place-items:center;color:var(--ink-2)}
.icopick button svg{width:18px;height:18px}
.icopick button[aria-pressed="true"]{background:var(--blush);border-color:var(--blush-2);color:var(--ink)}
.colpick button{width:26px;height:26px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--hair)}
.colpick button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.addf .bar{display:flex;gap:8px;justify-content:flex-end}

/* list */
.listv{padding:4px 18px 120px}
.lhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 10px;flex-wrap:wrap}
.lhead .t{font-family:var(--f-display);font-size:17px}
.lhead .acts{display:flex;gap:6px}
.month{font-family:var(--f-digit);font-weight:300;font-style:italic;font-size:15px;color:var(--ink-2);margin:16px 0 6px;letter-spacing:.04em}
.entry{width:100%;text-align:left;display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start;padding:12px 0;border-top:1px dashed var(--hair)}
.entry .d{font-family:var(--f-digit);font-weight:300;font-style:italic;font-size:24px;line-height:1}
.entry .d small{display:block;font-style:normal;font-family:var(--f-ui);font-size:11px;color:var(--ink-2);margin-top:4px}
.entry .meta{display:flex;gap:6px;align-items:center;color:var(--ink-2);font-size:12px;margin-bottom:4px;flex-wrap:wrap}
.entry .meta span{display:inline-flex;align-items:center;gap:2px}
.entry .meta svg{width:15px;height:15px}
.entry .ex{font-family:var(--f-display);font-size:15px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
.import{border:1px solid var(--hair);background:var(--paper);border-radius:14px;padding:14px;display:grid;gap:10px;margin-bottom:6px}
.import textarea{min-height:140px;font-size:13px;line-height:22px;font-family:var(--f-ui);background:var(--bg)}
.import .rule{font-size:12px;color:var(--ink-2);line-height:1.7}
code{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink);background:var(--blush);padding:1px 4px;border-radius:4px;word-break:break-all}
.import .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.import .pv{font-size:12px;color:var(--ink-2);flex:1;min-width:140px;line-height:1.5}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}

.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;white-space:nowrap;pointer-events:none}

/* bottom sheets (ask / date picker) */
.bs{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end}
.bs .scrim{position:absolute;inset:0}
.bs-card{position:relative;background:var(--bg);border-radius:24px 24px 0 0;border-top:1px solid var(--hair);padding:10px 18px 22px;max-height:88%;overflow-y:auto;box-shadow:0 -20px 50px -30px rgba(80,60,70,.45)}
.bs-grip{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.bs-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.bs-title h3{margin:0;font-family:var(--f-classic);font-weight:600;font-size:19px;letter-spacing:.1em}
.bs-title span{font-size:12px;color:var(--ink-2)}
.bs .lab2{font-size:12px;color:var(--ink-2);letter-spacing:.12em;margin:14px 0 8px}
.bs .note{font-size:12.5px;color:var(--ink-2);line-height:1.7;background:var(--paper);border:1px solid var(--hair);border-radius:12px;padding:10px 12px}
.bs .note b{color:var(--ink);font-weight:500}
.bs .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.segs{display:flex;gap:6px;flex-wrap:wrap}

/* date picker */
.dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dp-ym{font-family:var(--f-digit);font-weight:300;font-style:italic;font-size:24px;display:inline-flex;align-items:center;gap:6px;padding:2px 6px;border-radius:8px}
.dp-ym small{font-family:var(--f-ui);font-style:normal;font-size:12px;color:var(--ink-2)}
.dp-ym svg{width:14px;height:14px;color:var(--ink-2)}
.dp-nav{display:flex;gap:6px}
.dp-nav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--hair);background:var(--paper);display:grid;place-items:center;color:var(--ink-2)}
.dp-nav svg{width:16px;height:16px}
.dp-wk{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--ink-2);text-align:center;margin-bottom:4px}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dp-day{aspect-ratio:1/1.05;border-radius:12px;display:grid;place-content:center;justify-items:center;gap:0;position:relative}
.dp-day b{font-family:var(--f-digit);font-weight:300;font-size:19px;line-height:1}
.dp-day small{font-size:9.5px;color:var(--ink-2);line-height:1.3}
.dp-day.out{opacity:.28}
.dp-day.today b{color:var(--accent)}
.dp-day.today::after{content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.dp-day.sel{background:var(--accent);color:var(--accent-ink)}
.dp-day.sel b{color:var(--accent-ink)}.dp-day.sel small{color:var(--accent-ink);opacity:.85}
.dp-day.sel::after{background:var(--accent-ink)}
.dp-day.dis{opacity:.2;pointer-events:none}
.dp-years{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:260px;overflow-y:auto;padding:2px}
.dp-years button,.dp-months button{height:40px;border-radius:12px;border:1px solid var(--hair);background:var(--paper);font-family:var(--f-digit);font-weight:300;font-size:17px}
.dp-years button[aria-pressed="true"],.dp-months button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dp-months{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dp-quick{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.hours{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hours button{padding:7px 2px;border-radius:12px;border:1px solid var(--hair);background:var(--paper);display:grid;gap:1px;font-size:14px;font-family:var(--f-classic)}
.hours button small{font-family:var(--f-ui);font-size:10px;color:var(--ink-2)}
.hours button[aria-pressed="true"]{background:var(--blush);border-color:var(--accent)}

/* sheets (settings / spec) */
.sheet{position:absolute;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding:0 18px 40px}
.sheet-top{position:sticky;top:0;margin:0 -18px;padding:16px 18px 10px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;z-index:2}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0}
.sheet h3{font-size:12px;letter-spacing:.18em;color:var(--ink-2);font-weight:500;margin:24px 0 10px}
.sheet p,.sheet li{font-size:13.5px;line-height:1.75}
.sheet ul{padding-left:18px;margin:0}
.pals{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pal{display:grid;justify-items:center;gap:6px;font-size:12px;color:var(--ink-2);padding:8px 0;border-radius:12px;border:1px solid transparent}
.pal i{width:36px;height:36px;border-radius:50%;display:block;border:1px solid var(--hair)}
.pal[aria-pressed="true"]{border-color:var(--line);background:var(--paper);color:var(--ink)}
.fonts{display:grid;gap:8px}
.fopt{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;text-align:left;border:1px solid var(--hair);border-radius:12px;padding:10px 14px;background:var(--paper)}
.fopt b{font-weight:400;font-size:20px;display:block}
.fopt span span{font-size:12px;color:var(--ink-2)}
.fopt[aria-pressed="true"],.copt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fopt em{font-style:normal;font-size:12px;color:var(--accent)}
.cups{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.copt{border:1px solid var(--hair);border-radius:14px;background:var(--paper);padding:10px 4px 8px;display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--ink-2)}
.copt svg{width:70px;height:88px;overflow:visible}
.copt[aria-pressed="true"]{color:var(--ink)}
.clist{display:grid;gap:6px}
.clist p{margin:0;color:var(--ink-2);font-size:13px}
.citem{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--hair);border-radius:12px;background:var(--paper);font-size:14px}
.citem svg{width:18px;height:18px}
.citem .x{margin-left:auto;color:var(--ink-2);font-size:12px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid var(--hair);border-radius:12px;background:var(--paper);font-size:14px;width:100%;text-align:left}
.srow+.srow{margin-top:8px}
.srow span{color:var(--ink-2);font-size:12.5px;text-align:right}
.srow span.set{color:var(--ink)}
.prof{display:grid;gap:8px}
.prof .hint{font-size:12px;color:var(--ink-2);line-height:1.6}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sw div{border:1px solid var(--hair);border-radius:10px;overflow:hidden;font-size:11px;background:var(--paper)}
.sw i{display:block;height:36px}
.sw span{display:block;padding:5px 7px;line-height:1.4}
.ig{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;text-align:center;font-size:11px;color:var(--ink-2)}
.ig div{display:grid;justify-items:center;gap:3px;padding:8px 0;border:1px solid var(--hair);border-radius:10px;background:var(--paper)}
.ig svg{width:22px;height:22px;color:var(--ink)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:12.5px;width:100%;min-width:360px}
.tbl td,.tbl th{border-bottom:1px solid var(--hair);padding:7px 6px;text-align:left;vertical-align:top;line-height:1.5}
.tbl th{font-weight:500;color:var(--ink-2)}
pre.code{background:var(--paper);border:1px solid var(--hair);border-radius:10px;padding:12px;font-size:12px;overflow-x:auto;line-height:1.55}

@media (prefers-reduced-motion: reduce){.doll,.sill .leaves,.doll .flutter{animation:none}}
</style>
</head>
<body>
<div class="app on-draw" id="app">
  <svg class="doodle sill" id="sill" viewBox="0 0 400 120" preserveAspectRatio="xMidYMax meet" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>

  <header>
    <div class="brand">小日记 <small>Little Diary</small></div>
    <div class="hbtns">
      <button class="hbtn ic" id="soundBtn" aria-pressed="true" aria-label="声音">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h3l5 4V6L7 10z"/><path class="wave" d="M16 9.5q2 2.5 0 5M18.5 7.5q3.5 4.5 0 9"/></svg>
      </button>
      <button class="hbtn ic" id="setBtn" aria-label="设置">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M18 7h2M4 17h3M12 17h8"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="9.5" cy="17" r="2.3"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="view" id="v-draw">
      <div class="fbar">
        <button class="fbtn" id="fBtn" aria-expanded="false"><span id="fLab">筛选</span><b id="fSum"></b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="fpanel" id="fPanel" hidden>
          <div class="row" id="moodRow"></div>
          <div class="row" id="weatherRow"></div>
          <div class="mlist" id="oracleRow"></div>
          <div class="row" id="quoteRow"></div>
          <div class="row" id="quoteRow2"></div>
        </div>
      </div>
      <div class="cup-area">
        <svg class="doodle doll" id="hang" viewBox="0 0 80 160" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
        <div class="cflow" id="cflow"><div class="cface ghost" id="cfPrev"></div><div class="cface ghost" id="cfNext"></div><div class="cface main" id="cfMain">
        <button class="cup-wrap" id="cup" aria-label="摇签筒，抽一篇日记">
          <svg class="cup-back" id="cupBack" viewBox="0 0 160 150" aria-hidden="true"></svg>
          <div class="sticks" id="sticks"></div>
          <svg class="cup-front" id="cupFront" viewBox="0 0 160 150" aria-hidden="true"></svg>
          <span class="cup-shadow"></span>
        </button></div><div class="empty-cup" id="emptyCup" hidden>这个组合还没有日记<br>换个心情试试</div></div>
        <div class="mbar">
        <div class="mswitch" id="seg" data-m="diary" role="tablist" aria-label="签种">
          <button type="button" class="marr" data-dir="-1" aria-label="上一个签种"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6l-6 6 6 6"/></svg></button>
          <div class="mmid"><span class="mname" id="mName">日记签</span><span class="mdots"><button type="button" role="tab" data-m="diary" aria-selected="true" aria-label="日记签"></button><button type="button" role="tab" data-m="oracle" aria-selected="false" aria-label="玄学签"></button><button type="button" role="tab" data-m="quote" aria-selected="false" aria-label="好句签"></button></span></div>
          <button type="button" class="marr" data-dir="1" aria-label="下一个签种"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6l6 6-6 6"/></svg></button>
        </div>
        <div class="cup-hint" id="hint"></div>
        </div>
      </div>
    </section>

    <section class="view scroll write" id="v-write" hidden>
      <form id="wForm" novalidate style="display:grid;gap:16px">
        <div><span class="field-lab">日期</span><button type="button" class="datebtn" id="wDateBtn"></button></div>
        <div>
          <div class="pk" id="pkMood"></div>
          <div class="pk" id="pkWeather"></div>
        </div>
        <div><label class="field-lab" for="wText">写点什么</label><textarea id="wText" placeholder="今天有什么小事？一句话也算。"></textarea></div>
        <div class="wfoot"><span class="count" id="wCount">0 字</span><button class="btn primary" type="submit">投进签筒</button></div>
      </form>
    </section>

    <section class="view scroll listv" id="v-list" hidden>
      <div class="lhead">
        <span class="t" id="lTitle"></span>
        <div class="acts">
          <button class="hbtn" id="clearSamples" hidden>清除示例</button>
          <button class="hbtn" id="impBtn">导入</button>
        </div>
      </div>
      <div class="import" id="imp" hidden>
        <div class="rule">
          <b style="font-weight:500;color:var(--ink)">文本</b>：每篇以日期开头（<code>2024-05-02</code> / <code>2024.5.2</code> / <code>2024年5月2日</code>），提到的天气、心情词会自动打标签，没写天气的记为晴。<br>
          <b style="font-weight:500;color:var(--ink)">CSV · 每日List</b>：一行一件事，按日期合成一篇。表头：<code>日期,类型,任务,完成,用时(分钟),时间</code>。心情记为无，天气记为晴。<br>
          <b style="font-weight:500;color:var(--ink)">CSV · 日记</b>：<code>日期,心情,天气,内容</code>，多个心情用 <code>;</code> 隔开。也支持 .json。
        </div>
        <textarea id="impText" placeholder="2024年5月2日 晴&#10;今天去公园放风筝，很开心……&#10;&#10;或者粘贴 CSV：&#10;日期,类型,任务,完成,用时(分钟),时间&#10;2026-09-30,重复,喝够2000ml水,是,,21:10"></textarea>
        <div class="bar">
          <span class="pv" id="impPv">还没有内容</span>
          <span class="btn sm file">选文件<input type="file" id="impFile" accept=".txt,.md,.json,.csv,text/plain,text/csv,application/json"></span>
          <button class="btn sm primary" id="impGo" disabled>导入</button>
        </div>
      </div>
      <div id="list"></div>
    </section>
  </main>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-v="draw" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h12l-1.4 9.2a1 1 0 0 1-1 .8H8.4a1 1 0 0 1-1-.8z"/><path d="M9 11V4M12 11V2.5M15 11V5"/></svg>抽一支</button>
    <button class="tab" role="tab" data-v="write" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4.5l4.5 4.5L9 19.5H4.5V15z"/><path d="M13 6.5l4.5 4.5"/></svg>写一篇</button>
    <button class="tab" role="tab" data-v="list" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h11a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6z"/><path d="M6 3.5v17M9.5 8h5M9.5 11.5h5"/></svg>日记本</button>
  </nav>

  <div class="overlay" id="ov" hidden>
    <div class="scrim" id="scrim"></div>
    <div class="stage" id="stage"></div>
    <div class="note-actions" id="nact"></div>
  </div>

  <div class="sheet" id="settings" hidden></div>
  <div class="sheet" id="spec" hidden></div>
  <div class="bs" id="bs" hidden><div class="scrim" id="bsScrim"></div><div class="bs-card" id="bsCard"></div></div>
</div>
<script src="js/xdata.js"></script>
<script src="js/quotes.js"></script>
<script src="js/vendor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
